services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-template-app
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    depends_on:
      - wordpress-db
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./lang:/var/www/html/lang
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./.env:/var/www/html/.env
      - storage-data:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache

  vite:
    image: node:22-alpine
    container_name: laravel-template-vite
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - ./:/app

  wordpress:
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
    container_name: laravel-template-wordpress
    restart: unless-stopped
    depends_on:
      - wordpress-db
    ports:
      - "8081:80"
    env_file:
      - .env
    volumes:
      - ./wordpress:/var/www/html

  wordpress-db:
    image: mariadb:11.8
    container_name: laravel-template-wordpress-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:
  storage-data:
  bootstrap-cache: